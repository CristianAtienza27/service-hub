services:
  postgres:
    image: postgres:17-alpine
    container_name: service-hub-postgres

    environment:
      POSTGRES_DB: service_hub
      POSTGRES_USER: service_hub
      POSTGRES_PASSWORD: service_hub_local

    ports:
      - "5432:5432"

    volumes:
      - service_hub_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U service_hub -d service_hub
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  service_hub_postgres_data: